<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>pankti</title>
<meta name="description" content="Type a quote, get an image sized for Instagram.">
<meta property="og:title" content="pankti">
<meta property="og:description" content="Type a quote, get an image sized for Instagram.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bhaumikmistry.github.io/pankti/">
<meta name="theme-color" content="#0e100d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><text y=%2226%22 font-size=%2228%22>&#8220;</text></svg>">
<style>
  :root {
    --bg: #0e100d;
    --panel: #161a15;
    --line: #262b24;
    --line-2: #363d33;
    --text: #e9ece4;
    --muted: #8b9384;
    --accent: #9dc17f;
    --r: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: inherit; }

  header {
    border-bottom: 1px solid var(--line);
    padding: 18px 22px;
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; font-weight: 650; letter-spacing: -0.02em; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .gh { margin-left: auto; color: var(--muted); font-size: 13px; text-decoration: none; }
  header .gh:hover { color: var(--text); }

  .wrap {
    display: grid;
    grid-template-columns: 340px minmax(0, 1fr);
    gap: 0;
    align-items: start;
    min-height: calc(100vh - 59px);
  }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }

  .controls {
    border-right: 1px solid var(--line);
    padding: 20px 22px 60px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  @media (max-width: 900px) { .controls { border-right: 0; border-bottom: 1px solid var(--line); } }

  label { display: block; }
  .lbl {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .lbl .val { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--text); }

  textarea, input[type="text"] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: var(--r);
    color: var(--text);
    padding: 10px 12px;
    font: inherit;
    resize: vertical;
  }
  textarea { min-height: 110px; line-height: 1.45; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line-2);
    background: var(--panel);
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 11px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .chip:hover { color: var(--text); }
  .chip[aria-pressed="true"] { border-color: var(--text); color: var(--text); background: #1e241c; }
  .chip .sw { width: 11px; height: 11px; border-radius: 3px; border: 1px solid rgba(255,255,255,.22); }

  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    height: 20px;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: var(--line-2); border-radius: 2px; }
  input[type="range"]::-moz-range-track { height: 3px; background: var(--line-2); border-radius: 2px; }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); margin-top: -6px; border: 0;
  }
  input[type="range"]::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: var(--accent); border: 0; }

  .toggle { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 15px; height: 15px; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
  button.go {
    flex: 1;
    min-width: 130px;
    background: var(--text);
    color: #10130f;
    border: 0;
    border-radius: var(--r);
    padding: 11px 14px;
    font: inherit;
    font-weight: 650;
    cursor: pointer;
  }
  button.go:hover { background: #fff; }
  button.go:disabled { opacity: .45; cursor: default; }
  a.ghost, button.ghost {
    border: 1px solid var(--line-2);
    background: transparent;
    color: var(--muted);
    border-radius: var(--r);
    padding: 11px 14px;
    font: inherit;
    text-decoration: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
  }
  a.ghost:hover, button.ghost:hover { color: var(--text); border-color: var(--text); }

  .stage {
    padding: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .frame {
    box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 24px 60px -30px rgba(0,0,0,.9);
    border-radius: 4px;
    overflow: hidden;
    /* The card renders at full pixel size and is scaled down to fit, so what
       is on screen is exactly what downloads. */
    transform-origin: top center;
  }
  .meta { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .warn { color: #e0a35c; }
  .err { color: #e08b7c; }
</style>
</head>
<body>

<header>
  <h1>pankti</h1>
  <span class="sub">Type a quote, get an image sized for Instagram.</span>
  <a class="gh" href="https://github.com/bhaumikmistry/pankti" target="_blank" rel="noopener">github</a>
</header>

<div class="wrap">
  <div class="controls">
    <label>
      <span class="lbl">Quote</span>
      <textarea id="quote" spellcheck="false">Reality has a surprising amount of detail.</textarea>
    </label>

    <div class="row">
      <label>
        <span class="lbl">Author</span>
        <input id="author" type="text" value="John Salvatier">
      </label>
      <label>
        <span class="lbl">Source</span>
        <input id="source" type="text" value="">
      </label>
    </div>

    <div>
      <span class="lbl">Theme</span>
      <div class="chips" id="themes"></div>
    </div>

    <div>
      <span class="lbl">Font</span>
      <div class="chips" id="fonts"></div>
    </div>

    <div>
      <span class="lbl">Preset</span>
      <div class="chips" id="presets"></div>
    </div>

    <label>
      <span class="lbl">Width <span class="val" id="wv"></span></span>
      <input id="w" type="range" min="600" max="2000" step="10" value="1080">
    </label>

    <label>
      <span class="lbl">Height <span class="val" id="hv"></span></span>
      <input id="h" type="range" min="600" max="2400" step="10" value="1080">
    </label>

    <label>
      <span class="lbl">Line height <span class="val" id="lhv"></span></span>
      <input id="lh" type="range" min="1" max="2" step="0.02" value="1.34">
    </label>

    <label>
      <span class="lbl">Margin <span class="val" id="padv"></span></span>
      <input id="pad" type="range" min="2" max="22" step="0.5" value="11">
    </label>

    <div>
      <label class="toggle" for="auto">
        <input id="auto" type="checkbox" checked>
        Fit the text to the card
      </label>
      <div id="manualWrap" hidden style="margin-top:12px">
        <span class="lbl">Type size <span class="val" id="fsv"></span></span>
        <input id="fs" type="range" min="16" max="300" step="1" value="90">
      </div>
    </div>

    <div class="actions">
      <button class="go" id="download">Download PNG</button>
      <button class="ghost" id="copy" type="button">Copy link</button>
      <a class="ghost" id="asIssue" target="_blank" rel="noopener">Open as issue</a>
    </div>
  </div>

  <div class="stage">
    <div class="frame" id="frame"></div>
    <div class="meta" id="meta"></div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
